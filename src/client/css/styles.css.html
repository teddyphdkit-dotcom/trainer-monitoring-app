<style>
  :root {
    --bg-app: #0b0f17;
    --bg-surface: rgba(22, 28, 40, 0.82);
    --bg-subtle: rgba(30, 41, 59, 0.68);
    --border-color: rgba(255, 255, 255, 0.1);
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --primary-soft: rgba(59, 130, 246, 0.18);
    --success: #4ade80;
    --success-soft: rgba(34, 197, 94, 0.16);
    --warning: #fbbf24;
    --warning-soft: rgba(245, 158, 11, 0.16);
    --danger: #fb7185;
    --danger-soft: rgba(244, 63, 94, 0.18);
    --sidebar-width: 260px;
    --header-height: 60px;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    --shadow-md: 0 18px 42px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-primary);
    background:
      radial-gradient(circle at 85% 12%, rgba(59, 130, 246, 0.14) 0%, transparent 42%),
      radial-gradient(circle at 20% 88%, rgba(225, 29, 72, 0.12) 0%, transparent 45%),
      linear-gradient(160deg, #0b0f17 0%, #111726 55%, #0c1019 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea {
    font-family: inherit;
    font-size: 15px;
  }

  code {
    background: rgba(255, 255, 255, 0.08);
    color: #93c5fd;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 12.5px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .hidden {
    display: none !important;
  }

  /* ==================== BUTTONS & INPUTS ==================== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    padding: 10px 16px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    font-weight: 600;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease, opacity 0.15s ease;
    text-decoration: none;
    white-space: nowrap;
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-sm {
    min-height: 32px;
    padding: 5px 11px;
    font-size: 12.5px;
    border-radius: 8px;
  }

  /* Tombol aksi di tabel/kartu mobile lebih ramping agar tidak mendominasi judul materi */
  table.data-table td .btn-sm,
  .mobile-item-actions .btn-sm {
    min-height: 28px;
    padding: 4px 10px;
    font-size: 12px;
    gap: 5px;
    border-radius: 7px;
    font-weight: 500;
  }

  table.data-table td .btn-danger,
  .mobile-item-actions .btn-danger {
    background: rgba(225, 29, 72, 0.14);
    border-color: rgba(244, 63, 94, 0.36);
    color: #fda4af;
    box-shadow: none;
  }

  table.data-table td .btn-danger:hover:not(:disabled),
  .mobile-item-actions .btn-danger:hover:not(:disabled) {
    background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
    border-color: rgba(255, 255, 255, 0.2);
    color: #ffffff;
  }

  .btn-primary {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    border-color: rgba(255, 255, 255, 0.16);
    color: #fff;
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.32);
  }
  .btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-primary);
    border-color: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(12px);
  }
  .btn-secondary:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.22);
  }

  .btn-danger {
    background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
    border-color: rgba(255, 255, 255, 0.16);
    color: #fff;
    box-shadow: 0 6px 16px rgba(225, 29, 72, 0.3);
  }
  .btn-danger:hover:not(:disabled) {
    background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
  }
  .btn-ghost:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
  }

  .btn-block {
    width: 100%;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }

  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .form-control {
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: var(--radius-sm);
    background: rgba(15, 23, 42, 0.68);
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .form-control::placeholder {
    color: rgba(148, 163, 184, 0.68);
  }

  .form-control option {
    background: #111827;
    color: #f8fafc;
  }

  .form-control:focus {
    border-color: #60a5fa;
    background: rgba(15, 23, 42, 0.88);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.22);
  }

  .form-hint {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ==================== PASSWORD SHOW / HIDE TOGGLE ==================== */
  .password-field-wrap {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
  }

  .password-field-wrap .form-control {
    padding-right: 112px !important;
  }

  .password-toggle-btn {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    min-height: 32px;
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.08);
    color: #cbd5e1;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    z-index: 2;
    user-select: none;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .password-toggle-btn:hover {
    background: rgba(59, 130, 246, 0.25);
    color: #ffffff;
    border-color: rgba(96, 165, 250, 0.5);
  }

  /* ==================== BADGES & ALERTS ==================== */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .badge-primary { background: var(--primary-soft); color: #93c5fd; border-color: rgba(59, 130, 246, 0.32); }
  .badge-success { background: var(--success-soft); color: #4ade80; border-color: rgba(34, 197, 94, 0.32); }
  .badge-warning { background: var(--warning-soft); color: #fbbf24; border-color: rgba(245, 158, 11, 0.32); }
  .badge-danger { background: var(--danger-soft); color: #fb7185; border-color: rgba(244, 63, 94, 0.35); }
  .badge-neutral { background: rgba(255, 255, 255, 0.07); color: var(--text-secondary); }

  .alert {
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    font-size: 14px;
    margin-bottom: 16px;
    backdrop-filter: blur(12px);
  }
  .alert-error { background: rgba(244, 63, 94, 0.16); border-color: rgba(244, 63, 94, 0.4); color: #fda4af; }
  .alert-success { background: rgba(34, 197, 94, 0.16); border-color: rgba(34, 197, 94, 0.4); color: #86efac; }
  .alert-warning { background: rgba(245, 158, 11, 0.16); border-color: rgba(245, 158, 11, 0.4); color: #fde68a; }
  .alert-info { background: rgba(59, 130, 246, 0.16); border-color: rgba(59, 130, 246, 0.4); color: #bfdbfe; }

  /* ==================== AUTH & BOOTSTRAP SHELL (GLASSY LOGIN V2) ==================== */
  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background:
      radial-gradient(circle at 18% 22%, rgba(30, 94, 255, 0.22) 0%, transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(225, 29, 72, 0.16) 0%, transparent 45%),
      linear-gradient(145deg, #0b0e14 0%, #121722 50%, #0d111a 100%);
    color: #f8fafc;
  }

  .auth-card {
    width: 100%;
    max-width: 460px;
    background: rgba(22, 28, 40, 0.76);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    color: #f8fafc;
  }

  .auth-card.auth-split-card {
    max-width: 820px;
    padding: 0;
    display: grid;
    grid-template-columns: 1.08fr 0.92fr;
    overflow: hidden;
  }

  .auth-form-pane {
    padding: 34px 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .auth-hero-pane {
    padding: 34px 30px;
    background:
      radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.14) 0%, transparent 55%),
      linear-gradient(155deg, rgba(255, 255, 255, 0.09) 0%, rgba(15, 23, 42, 0.55) 100%);
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 14px;
  }

  .auth-hero-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.65);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .auth-hero-heading {
    margin: 0;
    font-size: 28px;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #ffffff;
  }

  .auth-hero-desc {
    margin: 0;
    font-size: 13px;
    line-height: 1.6;
    color: rgba(226, 232, 240, 0.78);
  }

  .auth-glass-pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .auth-glass-pill-btn:hover {
    background: rgba(255, 255, 255, 0.16);
    transform: translateY(-1px);
  }

  .auth-card .form-label {
    color: rgba(226, 232, 240, 0.85);
  }

  .auth-card .form-control {
    background: rgba(15, 23, 42, 0.62);
    border-color: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    border-radius: 12px;
  }
  .auth-card .form-control::placeholder {
    color: rgba(148, 163, 184, 0.7);
  }
  .auth-card .form-control:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.22);
  }

  .auth-card .btn-primary {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
  }

  .auth-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 22px;
    gap: 10px;
  }

  .auth-brand img {
    max-height: 54px;
    max-width: 180px;
    object-fit: contain;
  }

  .auth-brand-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, #2563eb 0%, #e11d48 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 20px;
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
  }

  .auth-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
  }

  .auth-subtitle {
    margin: 0;
    font-size: 13px;
    color: rgba(203, 213, 225, 0.8);
  }

  .auth-links {
    margin-top: 16px;
    display: flex;
    justify-content: center;
    gap: 12px;
    font-size: 13px;
  }

  .link-btn {
    background: none;
    border: none;
    color: #93c5fd;
    font-weight: 600;
    cursor: pointer;
    padding: 4px;
  }
  .link-btn:hover { text-decoration: underline; color: #bfdbfe; }

  @media (max-width: 768px) {
    .auth-card.auth-split-card {
      grid-template-columns: 1fr;
    }
    .auth-hero-pane {
      border-left: none;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px 24px;
    }
    .auth-form-pane {
      padding: 26px 22px;
    }
  }

  /* ==================== APP SHELL (PC & ANDROID — SIDEBAR UI V2) ==================== */
  .app-layout {
    display: flex;
    min-height: 100vh;
    width: 100%;
    max-width: 100vw;
  }

  .sidebar {
    width: var(--sidebar-width);
    background: linear-gradient(180deg, #161b26 0%, #0e121b 100%);
    color: #e2e8f0;
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.22s ease, margin-left 0.22s ease, transform 0.22s ease;
    z-index: 40;
    box-shadow: 6px 0 24px rgba(15, 23, 42, 0.18);
  }

  .app-layout.sidebar-collapsed .sidebar {
    margin-left: calc(-1 * var(--sidebar-width));
  }

  .sidebar-header {
    height: var(--header-height);
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .sidebar-logo {
    max-height: 32px;
    max-width: 32px;
    object-fit: contain;
    border-radius: 6px;
  }

  .sidebar-brand-text {
    font-weight: 700;
    font-size: 15px;
    color: #ffffff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sidebar-profile-card {
    margin: 12px 12px 6px;
    padding: 10px 12px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ef4444 0%, #2563eb 100%);
    color: #ffffff;
    font-weight: 800;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .sidebar-profile-name {
    font-weight: 700;
    font-size: 13px;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-profile-sub {
    font-size: 11px;
    color: rgba(148, 163, 184, 0.85);
  }

  .sidebar-search-box {
    padding: 4px 12px 6px;
  }

  .sidebar-search-input {
    width: 100%;
    min-height: 36px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: #f8fafc;
    font-size: 12px;
    outline: none;
  }
  .sidebar-search-input::placeholder {
    color: rgba(148, 163, 184, 0.7);
  }
  .sidebar-search-input:focus {
    border-color: rgba(239, 68, 68, 0.6);
  }

  .sidebar-nav {
    flex: 1;
    padding: 8px 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav-section-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(148, 163, 184, 0.75);
    padding: 10px 12px 4px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: rgba(203, 213, 225, 0.85);
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, transform 0.15s ease;
  }

  .nav-item:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #ffffff;
  }

  .nav-item.active {
    background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
    color: #ffffff;
    box-shadow: 0 6px 18px rgba(225, 29, 72, 0.35);
  }

  .sidebar-footer {
    padding: 12px 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 13px;
  }

  .sidebar-footer .btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    color: #f8fafc;
    border-color: rgba(255, 255, 255, 0.14);
  }
  .sidebar-footer .btn-secondary:hover {
    background: rgba(239, 68, 68, 0.22);
    border-color: rgba(239, 68, 68, 0.45);
  }

  .main-container {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: transparent;
  }

  .top-header {
    height: var(--header-height);
    background: rgba(15, 20, 30, 0.78);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 30;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .header-title {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .icon-btn {
    min-width: 44px;
    min-height: 44px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #f8fafc;
    transition: background 0.18s ease, border-color 0.18s ease;
  }
  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.22);
  }

  .sync-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(34, 197, 94, 0.16);
    border: 1px solid rgba(34, 197, 94, 0.32);
    color: #4ade80;
  }
  .sync-pill.offline {
    background: rgba(245, 158, 11, 0.16);
    border-color: rgba(245, 158, 11, 0.35);
    color: #fbbf24;
  }

  .page-content {
    flex: 1;
    padding: 20px;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }

  /* ==================== CARDS, TOOLBARS, TABLES (SMART GLASS BENTO) ==================== */
  .card {
    background: linear-gradient(155deg, rgba(26, 34, 48, 0.82) 0%, rgba(16, 22, 33, 0.88) 100%);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius-md);
    padding: 18px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
    color: var(--text-primary);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }

  .card-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
    align-items: flex-end;
  }

  .toolbar-field {
    flex: 1;
    min-width: 180px;
  }

  .tabs-bar {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 6px;
  }

  .tab-btn {
    min-height: 40px;
    padding: 8px 16px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-secondary);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .tab-btn:hover {
    background: rgba(255, 255, 255, 0.09);
    color: #ffffff;
  }

  .tab-btn.active {
    color: #ffffff;
    background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
    border-color: rgba(255, 255, 255, 0.18);
    box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
  }

  /* ==================== PHOTOS & GALLERY ==================== */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 10px;
    margin-top: 8px;
  }

  .photo-card {
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-sm);
    padding: 8px;
    background: rgba(15, 23, 42, 0.65);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .photo-thumb {
    width: 100%;
    height: 92px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    background: rgba(30, 41, 59, 0.8);
  }

  .lightbox-img-wrap {
    max-height: 62vh;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #090d16;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius-sm);
    padding: 8px;
  }

  .lightbox-img-wrap img {
    max-width: 100%;
    transition: transform 0.15s ease;
    transform-origin: center center;
  }

  .suggestion-box {
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: var(--radius-sm);
    background: rgba(17, 24, 39, 0.96);
    backdrop-filter: blur(16px);
    margin-top: 4px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }

  .suggestion-item {
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    background: transparent;
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .suggestion-item:last-child {
    border-bottom: none;
  }

  .suggestion-item:hover {
    background: rgba(59, 130, 246, 0.2);
  }

  /* ==================== DASHBOARD & KPI (SMART CONTROL BENTO) ==================== */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }

  .kpi-card {
    background:
      radial-gradient(circle at 90% 15%, rgba(59, 130, 246, 0.16) 0%, transparent 55%),
      linear-gradient(155deg, rgba(28, 37, 54, 0.86) 0%, rgba(16, 22, 34, 0.9) 100%);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-md);
    padding: 18px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.18s ease, border-color 0.18s ease;
  }

  .kpi-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.22);
  }

  .kpi-card.kpi-recurring-alert {
    border-color: rgba(244, 63, 94, 0.45);
    background:
      radial-gradient(circle at 90% 15%, rgba(225, 29, 72, 0.24) 0%, transparent 55%),
      linear-gradient(155deg, rgba(44, 19, 32, 0.88) 0%, rgba(24, 14, 24, 0.92) 100%);
  }

  .kpi-label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
  }

  .kpi-value {
    font-size: 30px;
    font-weight: 800;
    margin: 8px 0 4px;
    color: #ffffff;
    letter-spacing: -0.02em;
  }

  .kpi-card.kpi-recurring-alert .kpi-value {
    color: #fb7185;
  }

  .kpi-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  .filter-chips-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 110px;
    overflow-y: auto;
    padding: 8px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-sm);
    background: rgba(15, 23, 42, 0.65);
  }

  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 12px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .filter-chip:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
  }

  .filter-chip.selected {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: #fff;
    border-color: rgba(147, 197, 253, 0.5);
  }

  /* ==================== MULTI-SELECT DROPDOWN SLICER (PC & HP) ==================== */
  /* Kartu Filter Global dinaikkan lapisannya agar menu dropdown tidak tertimpa
     kartu KPI/tab di bawahnya (backdrop-filter membuat stacking context per kartu).
     Nilai 20 tetap di bawah topbar (30), overlay sidebar (35), sidebar (40) & modal (100+). */
  .dash-filter-card {
    position: relative;
    z-index: 20;
  }

  .ms-dropdown {
    position: relative;
    width: 100%;
  }

  .ms-dropdown.open {
    z-index: 5;
  }

  .ms-trigger {
    width: 100%;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: var(--radius-sm);
    background: rgba(15, 23, 42, 0.68);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .ms-trigger:hover {
    border-color: rgba(255, 255, 255, 0.26);
    background: rgba(15, 23, 42, 0.85);
  }

  .ms-dropdown.open .ms-trigger,
  .ms-trigger.has-selection {
    border-color: rgba(96, 165, 250, 0.55);
    background: rgba(30, 58, 138, 0.26);
  }

  .ms-trigger-text {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13.5px;
    color: var(--text-primary);
  }

  .ms-trigger-right {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .ms-trigger-badge {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .ms-chevron {
    font-size: 12px;
    color: var(--text-secondary);
    transition: transform 0.18s ease;
  }

  .ms-dropdown.open .ms-chevron {
    transform: rotate(180deg);
  }

  .ms-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 75;
    background: #0f1624;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 12px;
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.68);
    padding: 8px;
    display: none;
    flex-direction: column;
    gap: 6px;
  }

  .ms-dropdown.open .ms-menu {
    display: flex;
  }

  .ms-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .ms-action-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #93c5fd;
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .ms-action-btn:hover {
    background: rgba(59, 130, 246, 0.22);
    color: #ffffff;
  }

  .ms-search {
    width: 100%;
    min-height: 36px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(9, 13, 22, 0.85);
    color: #f8fafc;
    font-size: 13px;
    outline: none;
  }

  .ms-search:focus {
    border-color: #60a5fa;
  }

  .ms-list {
    max-height: 210px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .ms-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    user-select: none;
    min-height: 40px;
    transition: background 0.12s ease, color 0.12s ease;
  }

  .ms-option:hover {
    background: rgba(255, 255, 255, 0.07);
    color: #ffffff;
  }

  .ms-option.selected {
    background: rgba(59, 130, 246, 0.18);
    color: #ffffff;
    font-weight: 600;
  }

  .ms-checkbox {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: transparent;
    flex-shrink: 0;
    background: rgba(15, 23, 42, 0.7);
  }

  .ms-option.selected .ms-checkbox {
    background: #2563eb;
    border-color: #60a5fa;
    color: #ffffff;
  }

  .chart-box {
    position: relative;
    width: 100%;
    min-height: 260px;
  }

  @media (max-width: 1024px) {
    .kpi-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 560px) {
    .kpi-grid {
      grid-template-columns: 1fr;
    }
  }

  .table-wrap {
    width: 100%;
    overflow-x: auto;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  table.data-table th,
  table.data-table td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    text-align: left;
    vertical-align: middle;
    color: var(--text-primary);
  }

  table.data-table tbody tr:hover {
    background: rgba(255, 255, 255, 0.04);
  }

  table.data-table th {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    background: rgba(15, 23, 42, 0.78);
    font-weight: 700;
  }

  .mobile-card-list {
    display: none;
    flex-direction: column;
    gap: 12px;
  }

  .mobile-item-card {
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius-md);
    padding: 14px;
    background: rgba(17, 24, 39, 0.72);
    backdrop-filter: blur(14px);
    color: var(--text-primary);
  }

  .mobile-item-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
  }

  .mobile-item-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  /* ==================== MODAL & TOAST ==================== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 10, 18, 0.72);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }

  .modal-dialog {
    width: 100%;
    max-width: 540px;
    max-height: 90vh;
    overflow-y: auto;
    background: linear-gradient(155deg, rgba(24, 32, 48, 0.96) 0%, rgba(15, 20, 32, 0.98) 100%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--shadow-md);
    color: var(--text-primary);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .modal-title {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  /* ==================== KARTU KONFIRMASI MODERN ==================== */
  .tm-dialog-layer {
    position: fixed;
    inset: 0;
    z-index: 110;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(4, 8, 16, 0.62);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    transition: opacity 0.18s ease;
  }

  .tm-dialog-layer.show {
    opacity: 1;
  }

  .tm-dialog {
    --dlg-accent: #3b82f6;
    --dlg-accent-soft: rgba(59, 130, 246, 0.16);
    position: relative;
    width: 100%;
    max-width: 400px;
    padding: 26px 22px 20px;
    border-radius: 20px;
    text-align: center;
    color: var(--text-primary);
    background: linear-gradient(160deg, rgba(28, 37, 54, 0.98) 0%, rgba(14, 19, 30, 0.99) 100%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    overflow: hidden;
    transform: translateY(14px) scale(0.96);
    transition: transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }

  .tm-dialog::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--dlg-accent), transparent);
  }

  .tm-dialog-layer.show .tm-dialog {
    transform: translateY(0) scale(1);
  }

  .tm-dialog-danger { --dlg-accent: #ef4444; --dlg-accent-soft: rgba(239, 68, 68, 0.16); }
  .tm-dialog-warning { --dlg-accent: #f59e0b; --dlg-accent-soft: rgba(245, 158, 11, 0.16); }
  .tm-dialog-success { --dlg-accent: #22c55e; --dlg-accent-soft: rgba(34, 197, 94, 0.16); }
  .tm-dialog-info { --dlg-accent: #06b6d4; --dlg-accent-soft: rgba(6, 182, 212, 0.16); }

  .tm-dialog-icon {
    width: 62px;
    height: 62px;
    margin: 0 auto 14px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: var(--dlg-accent);
    background: var(--dlg-accent-soft);
    box-shadow: 0 0 0 7px rgba(255, 255, 255, 0.03), 0 0 28px var(--dlg-accent-soft);
  }

  .tm-dialog-title {
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 800;
    color: #ffffff;
  }

  .tm-dialog-message {
    font-size: 14px;
    line-height: 1.55;
    color: var(--text-secondary);
  }

  .tm-dialog-highlight {
    display: inline-block;
    max-width: 100%;
    margin-top: 12px;
    padding: 8px 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    color: #ffffff;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    word-break: break-word;
  }

  .tm-dialog-note {
    margin-top: 12px;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 12.5px;
    color: var(--dlg-accent);
    background: var(--dlg-accent-soft);
  }

  .tm-dialog-field {
    margin-top: 14px;
    text-align: left;
  }

  .tm-dialog-input {
    resize: vertical;
    min-height: 78px;
  }

  .tm-dialog-input.is-invalid {
    border-color: #ef4444 !important;
  }

  .tm-dialog-error {
    margin-top: 6px;
    font-size: 12.5px;
    color: #f87171;
  }

  .tm-dialog-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .tm-dialog-btn {
    flex: 1;
    min-height: 44px;
    justify-content: center;
    font-weight: 700;
  }

  @media (max-width: 420px) {
    .tm-dialog-actions {
      flex-direction: column-reverse;
    }
  }

  .toast-container {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 120;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: calc(100vw - 32px);
  }

  .toast {
    padding: 12px 16px;
    border-radius: 12px;
    background: rgba(22, 30, 46, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(14px);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow-md);
  }
  .toast.toast-error { background: rgba(190, 18, 60, 0.94); border-color: rgba(251, 113, 133, 0.45); }
  .toast.toast-success { background: rgba(21, 128, 61, 0.94); border-color: rgba(74, 222, 128, 0.45); }

  .drawer-backdrop {
    display: none;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  .spinner-dark {
    border-color: rgba(255, 255, 255, 0.2);
    border-top-color: var(--primary);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ==================== ANDROID / MOBILE <= 768px ==================== */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      transform: translateX(-100%);
      margin-left: 0 !important;
      box-shadow: var(--shadow-md);
    }

    .app-layout.drawer-open .sidebar {
      transform: translateX(0);
    }

    .app-layout.drawer-open .drawer-backdrop {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(6, 10, 18, 0.65);
      backdrop-filter: blur(4px);
      z-index: 35;
    }

    .page-content {
      padding: 14px 12px;
    }

    .grid-2, .grid-3 {
      grid-template-columns: 1fr;
    }

    .table-wrap {
      display: none;
    }

    .mobile-card-list {
      display: flex;
    }

    .sync-label-text {
      display: none;
    }
  }

  /* ==================== TEMA CERAH GLASSY (OPSIONAL VIA TOMBOL TOGGLE) ==================== */
  html.theme-light {
    --bg-app: #eef2f9;
    --bg-surface: rgba(255, 255, 255, 0.82);
    --bg-subtle: rgba(241, 245, 249, 0.88);
    --border-color: rgba(15, 23, 42, 0.1);
    --text-primary: #0f172a;
    --text-secondary: #334155;
    --text-muted: #64748b;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: rgba(37, 99, 235, 0.12);
    --success: #16a34a;
    --success-soft: rgba(22, 163, 74, 0.12);
    --warning: #d97706;
    --warning-soft: rgba(217, 119, 6, 0.12);
    --danger: #e11d48;
    --danger-soft: rgba(225, 29, 72, 0.12);
    --shadow-sm: 0 8px 24px rgba(15, 23, 42, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.85);
    --shadow-md: 0 18px 42px rgba(15, 23, 42, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    color-scheme: light;
  }

  html.theme-light,
  html.theme-light body {
    background:
      radial-gradient(circle at 85% 12%, rgba(59, 130, 246, 0.14) 0%, transparent 44%),
      radial-gradient(circle at 18% 88%, rgba(225, 29, 72, 0.09) 0%, transparent 45%),
      linear-gradient(160deg, #f1f5f9 0%, #e7eef8 55%, #f8fafc 100%);
    background-attachment: fixed;
    color: var(--text-primary);
  }

  html.theme-light code {
    background: rgba(37, 99, 235, 0.08);
    color: #1d4ed8;
    border-color: rgba(37, 99, 235, 0.16);
  }

  html.theme-light .sidebar {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.94) 0%, rgba(241, 245, 249, 0.96) 100%);
    color: var(--text-primary);
    border-right-color: rgba(15, 23, 42, 0.09);
    box-shadow: 6px 0 24px rgba(15, 23, 42, 0.07);
  }
